<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💼 Will I Get The Job? — Escape Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0F2247;--teal2:#2F4876;--tl:#E8ECF5;
  --coral:#C89B3C;--coral2:#DFC077;--cl:#FBF3E1;
  --amber:#8C6D1F;--amber2:#B7943F;--am:#FDF6E8;
  --red:#C62828;--green:#2E7D32;
  --ink:#171E2C;
  --bg:linear-gradient(135deg,#EEF1F8 0%,#FBF6EC 55%,#EEF1F8 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);min-height:100vh;background-attachment:fixed;color:var(--ink)}
h1,h2,h3,.pop{font-family:'Poppins',sans-serif}
.page{max-width:800px;margin:0 auto;padding:16px 18px 40px}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 22px rgba(15,34,71,.10);padding:24px;margin-bottom:14px}
.card-teal{border-top:4px solid var(--teal)}
.card-coral{border-top:4px solid var(--coral)}
.card-amber{border-top:4px solid var(--amber)}
.glass{position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;opacity:.10;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 42px),repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 42px);}
.btn{border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;border-radius:50px;padding:10px 22px;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.96)!important}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 3px 0 #050D1E}
.btn-teal:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #050D1E}
.btn-coral{background:var(--coral);color:#2B2005;box-shadow:0 3px 0 #8C6D1F}
.btn-coral:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #8C6D1F}
.btn-amber{background:var(--amber);color:#fff;box-shadow:0 3px 0 #5A4613}
.btn-amber:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #5A4613}
.btn-red{background:var(--red);color:#fff;box-shadow:0 3px 0 #8E1C1C}
.btn-red:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #8E1C1C}
.btn-green{background:var(--green);color:#fff;box-shadow:0 3px 0 #1B5E20}
.btn-green:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #1B5E20}
.btn-gray{background:#E4E4E4;color:#555}
.btn-gray:hover:not(:disabled){background:#D3D3D3}
.btn-outline{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn-outline:hover:not(:disabled){background:var(--tl)}
.lg{font-size:1rem;padding:13px 30px}
.sm{font-size:.78rem;padding:6px 14px}
.full{width:100%;justify-content:center}
.hdr{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:2px solid #E2D9BE;padding:10px 0;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(15,34,71,.10)}
.hdr-in{max-width:800px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px}
.prg{display:flex;align-items:center;flex:1}
.prg-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.92rem;font-weight:800;transition:all .3s;flex-shrink:0}
.prg-done{background:var(--teal);color:#fff;box-shadow:0 0 0 3px #C7CFE2}
.prg-active{background:var(--coral);color:#2B2005;box-shadow:0 0 0 3px #F1E3BC;animation:pls .8s ease-in-out infinite}
.prg-future{background:#EDEDED;color:#BBB}
.prg-line{flex:1;height:3px;margin:0 2px;transition:background .3s}
.prg-lbl{font-size:.52rem;font-weight:700;color:#AAA;text-align:center;margin-top:2px;max-width:52px;line-height:1.15}
.sc-pill{background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;padding:5px 15px;border-radius:50px;font-weight:800;font-size:.88rem;white-space:nowrap;box-shadow:0 3px 10px rgba(15,34,71,.25)}
.score-fab{position:fixed;top:12px;right:14px;z-index:45;background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;padding:7px 17px;border-radius:50px;font-weight:800;font-size:.9rem;box-shadow:0 3px 12px rgba(15,34,71,.35);white-space:nowrap}
.rep-fab{position:fixed;bottom:16px;left:16px;z-index:40}
input,textarea{font-family:'Inter',sans-serif;border:2px solid #E0E0E0;border-radius:11px;padding:10px 13px;font-size:.9rem;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,34,71,.12)}
textarea{resize:vertical;font-family:'Inter',sans-serif;line-height:1.6}
.opt{display:flex;align-items:center;gap:9px;padding:11px 14px;border:2px solid #E8E8E8;border-radius:12px;margin-bottom:8px;cursor:pointer;font-weight:600;font-size:.88rem;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal2);background:var(--tl)}
.opt.sel{border-color:var(--teal);background:#E9EDF6}
.opt.right{border-color:var(--green);background:#EDF7EE}
.opt.wrong{border-color:var(--red);background:#FFEBEE}
.let{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex-shrink:0;transition:all .15s}
.vfr{display:flex;align-items:center;gap:8px;padding:9px 12px;border:2px solid #E8E8E8;border-radius:12px;margin-bottom:7px;transition:all .15s;flex-wrap:wrap}
.tvf{padding:5px 13px;border-radius:50px;border:2px solid;cursor:pointer;font-weight:700;font-size:.79rem;transition:all .15s;font-family:'Inter',sans-serif}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{padding:9px 12px;border:2px solid #E8E8E8;border-radius:11px;cursor:pointer;font-weight:600;font-size:.83rem;min-height:50px;display:flex;align-items:center;transition:all .15s;line-height:1.35}
.mi:hover:not(.mu):not(.mok):not(.mko){border-color:var(--coral);background:var(--cl)}
.mi.msel{border-color:var(--coral);background:#F3E6C4;box-shadow:0 0 0 3px rgba(200,155,60,.25)}
.mi.mu{opacity:.4;cursor:default;border-style:dashed}
.mi.mok{border-color:var(--green);background:#EDF7EE;opacity:1;cursor:default}
.mi.mko{border-color:var(--red);background:#FFEBEE;opacity:1;cursor:default}
.sit{background:linear-gradient(135deg,var(--tl),var(--cl));border:2px solid var(--teal);border-radius:16px;padding:18px}
.slbl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);margin-bottom:2px}
.sval{font-weight:600;font-size:.9rem;margin-bottom:12px;line-height:1.5}
.hint{background:var(--am);border:2px dashed var(--amber);border-radius:11px;padding:9px 13px;font-size:.83rem;font-weight:700;color:#5A4613}
.rtxt{background:#F8FAFD;border-left:4px solid var(--teal2);padding:15px;border-radius:0 12px 12px 0;font-size:.87rem;line-height:1.8;margin-bottom:14px;color:#333}
.stars{font-size:1.5rem;letter-spacing:2px;color:var(--coral)}
.ibx{background:linear-gradient(135deg,var(--teal),var(--coral));border-radius:20px;padding:26px;text-align:center}
.iwd{font-family:'Poppins',sans-serif;font-size:2.5rem;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.ok{background:#EDF7EE;border:2px solid var(--green);border-radius:12px;padding:11px;font-weight:700;color:#1B5E20;font-size:.88rem}
.ko{background:var(--am);border:2px solid var(--amber);border-radius:12px;padding:11px;font-weight:700;color:#5A4613;font-size:.88rem}
.err{background:#FFEBEE;border:2px solid var(--red);border-radius:12px;padding:11px;font-weight:700;color:#7F0000;font-size:.88rem}
.rolecard{border-radius:14px;padding:16px;margin-bottom:10px}
.roleA{background:linear-gradient(135deg,var(--tl),#fff);border:2px solid var(--teal)}
.roleB{background:linear-gradient(135deg,var(--cl),#fff);border:2px solid var(--coral)}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.fadein{animation:fadein .32s ease-out}
.chip{background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;padding:3px 11px;border-radius:50px;font-weight:700;font-size:.78rem;display:inline-block;margin:2px}
@media(max-width:580px){.mg{grid-template-columns:1fr}.card{padding:17px}.iwd{font-size:1.85rem}.lg{font-size:.93rem;padding:11px 22px}}
@media print{.noprint{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ═══════════════════════════ GAME DATA ═══════════════════════════ */
const WW=['YOU','HAVE','GOT','THE','JOB'];

/* Mission 1 — The Job Ad vocabulary bank (30 items, QCM) */
const POOL1=[
 {w:'Job vacancy',d:'An open position that a company wants to fill'},
 {w:'Job advertisement',d:'The public announcement of a position to fill'},
 {w:'Applicant',d:'Someone submitting an application for a role'},
 {w:'Candidate',d:'Someone being evaluated for a role'},
 {w:'Curriculum Vitae (CV)',d:"A summary of someone's education and career history"},
 {w:'Cover letter',d:'A short note of motivation sent alongside your CV'},
 {w:'Qualification',d:'Proof, such as a diploma, that you can do a job'},
 {w:'Reference',d:"Someone who can vouch for a candidate's character"},
 {w:'Interview',d:'A meeting where a candidate is questioned and assessed'},
 {w:'Recruiter',d:'The professional in charge of finding new staff'},
 {w:'Human Resources (HR)',d:'The team handling staff, hiring and contracts'},
 {w:'Background check',d:"Verifying a candidate's history before hiring"},
 {w:'Criminal record',d:"The official record of someone's past convictions"},
 {w:'Security licence',d:'The legal authorisation required to work in security'},
 {w:'Professional card',d:'Proof that a security agent is legally allowed to work'},
 {w:'Employer',d:'The company or person who hires staff'},
 {w:'Employment contract',d:'The legal paper setting out the terms of a job'},
 {w:'Probation period',d:'The first weeks of a job, used to confirm suitability'},
 {w:'Shift pattern',d:'How working hours are organised across the week'},
 {w:'Salary',d:"What someone is paid for their work"},
 {w:'Skills',d:'What someone is able to do well'},
 {w:'Experience',d:"What you've learned by actually doing the job"},
 {w:'Training',d:'Preparing someone with the skills they need'},
 {w:'Certificate',d:'Written proof that you hold a qualification'},
 {w:'Deadline',d:'The last moment something can still be submitted'},
 {w:'Panel',d:'The group deciding who gets hired'},
 {w:'Shortlist',d:'The narrowed-down group invited to interview'},
 {w:'Onboarding',d:'Settling a new hire into their role'},
 {w:'Punctuality',d:'Never being late'},
 {w:'Vigilance',d:'Staying alert to spot problems early'}
];

/* Mission 3 — HR Terminology: French term → English translation (30 pairs) */
const POOL3=[
 {w:"Offre d'emploi",d:'Job offer'},
 {w:'Candidat',d:'Candidate'},
 {w:"Entretien d'embauche",d:'Job interview'},
 {w:'Lettre de motivation',d:'Cover letter'},
 {w:'Curriculum vitae',d:'CV'},
 {w:'Références',d:'References'},
 {w:'Compétences',d:'Skills'},
 {w:'Expérience professionnelle',d:'Professional experience'},
 {w:'Casier judiciaire',d:'Criminal record'},
 {w:'Carte professionnelle',d:'Professional card'},
 {w:"Période d'essai",d:'Probation period'},
 {w:'Employeur',d:'Employer'},
 {w:'Contrat de travail',d:'Employment contract'},
 {w:'Formation',d:'Training'},
 {w:'Diplôme',d:'Diploma'},
 {w:'Recruteur',d:'Recruiter'},
 {w:'Ressources humaines',d:'Human Resources'},
 {w:'Jury',d:'Panel'},
 {w:'Présélection',d:'Shortlisting'},
 {w:'Poste vacant',d:'Vacancy'},
 {w:'Date limite',d:'Deadline'},
 {w:'Salaire',d:'Salary'},
 {w:'Horaires de travail',d:'Working hours'},
 {w:"Rotation d'équipes",d:'Shift pattern'},
 {w:'Habilitation',d:'Security clearance'},
 {w:'Vérification des antécédents',d:'Background check'},
 {w:'Intégration',d:'Onboarding'},
 {w:'Uniforme',d:'Uniform'},
 {w:'Consigne',d:'Instruction'},
 {w:'Ponctualité',d:'Punctuality'}
];

/* Mission 2 — The Candidate's File: 3 reading sets (English text + True/False in French) */
const M2SETS=[
 {title:'The First Interview',
  text:`It was 9 a.m. when Amir arrived at Guardline Security's office for his first job interview. He had printed his CV and cover letter the night before and checked his professional card twice before leaving home. The receptionist asked him to wait in a small room with two other candidates.

When his name was called, Amir walked into the interview room and greeted the two-person panel with a firm handshake. They asked him about his previous experience, his availability for night shifts, and why he wanted to work in event security. Amir answered calmly, using clear examples from his training.

At the end of the interview, the recruiter thanked him and explained that a background check would be carried out before any final decision. Amir left the building feeling confident, even though he knew the result could take up to two weeks.`,
  vf:[
   {s:"Amir se rend à un entretien d'embauche chez Guardline Security.",a:true},
   {s:"Amir n'a apporté aucun document avec lui.",a:false},
   {s:'Amir a attendu seul, sans autre candidat.',a:false},
   {s:'Le jury est composé de deux personnes.',a:true},
   {s:'On ne lui a posé aucune question sur ses horaires.',a:false},
   {s:'Le recruteur mentionne une vérification des antécédents.',a:true},
   {s:'Le résultat est donné immédiatement à la fin de l\'entretien.',a:false},
   {s:'Amir quitte l\'entretien en se sentant plutôt confiant.',a:true}
  ]},
 {title:'The Background Check',
  text:`Two weeks after her interview, Léna had still not received an answer from the security company. She decided to call the HR department to ask about the delay. The recruiter explained that her background check was taking longer than usual because her previous employer was based abroad.

Léna understood the situation and asked politely if there was anything she could do to help. The recruiter suggested she send an additional reference letter directly from her former manager, which could speed up the process.

Léna contacted her former employer the same day and received the letter within twenty-four hours. She forwarded it immediately to the HR department, thanking them for their patience and clear communication throughout the process.

Three days later, Léna received a phone call confirming that she had passed the background check and would be offered the position, pending a final signature on her employment contract.`,
  vf:[
   {s:"Léna n'a reçu aucune réponse deux semaines après son entretien.",a:true},
   {s:'Léna décide de ne rien faire et attend sans contacter personne.',a:false},
   {s:"Le retard est dû au fait que son ancien employeur était à l'étranger.",a:true},
   {s:'Le recruteur lui propose de fournir une lettre de référence supplémentaire.',a:true},
   {s:"Léna refuse de contacter son ancien employeur.",a:false},
   {s:'Elle reçoit la lettre en moins de vingt-quatre heures.',a:true},
   {s:"Léna n'a jamais transmis la lettre au service RH.",a:false},
   {s:'Léna finit par obtenir le poste, sous réserve de signer le contrat.',a:true}
  ]},
 {title:'The Trial Shift',
  text:`Before confirming her contract, Marco's employer asked him to complete a one-day trial shift at a large shopping centre. He arrived thirty minutes early, wearing his uniform, and reported to the site supervisor as instructed in his onboarding email.

During the shift, Marco patrolled the main entrance, checked visitors' bags politely, and remained vigilant near the emergency exits. When a customer asked for directions to the lost property office, Marco guided her calmly and professionally, exactly as he had been trained to do.

At the end of the day, the site supervisor gave Marco some brief feedback, praising his punctuality and his calm attitude with the public. She noted a few small points to improve, such as radio communication with the control room.

Marco thanked her for the opportunity and left feeling that the trial shift had gone well overall, despite a few areas he still needed to work on.`,
  vf:[
   {s:'Marco doit réaliser une journée d\'essai avant la signature de son contrat.',a:true},
   {s:'Marco arrive en retard le jour de sa journée d\'essai.',a:false},
   {s:'Marco porte son uniforme dès son arrivée.',a:true},
   {s:'Marco refuse de contrôler les sacs des visiteurs.',a:false},
   {s:"Marco aide une cliente à trouver le bureau des objets trouvés.",a:true},
   {s:"La superviseure ne donne aucun retour à Marco à la fin de la journée.",a:false},
   {s:'La superviseure félicite la ponctualité de Marco.',a:true},
   {s:'Marco termine la journée en pensant que tout s\'est mal passé.',a:false}
  ]}
];

/* Mission 4 — The Interview: 3 role-based oral scenario sets (Role A = Recruiter, Role B = Candidate) */
const ROLES=[
 {e:'💼',t:'Interview Round — Motivation',
  a:{label:'Rôle A — Recruiter',w:'You are the recruiter. Ask the candidate why they want to work in event / retail security, and what makes them a good fit for the team.',h:'💡 Mots-clés SEULEMENT (max 8) — ex. why / motivation / team / security / experience / available'},
  b:{label:'Rôle B — Candidate',w:'You are the candidate. Explain briefly why you applied for this security job and what skills or qualities you can offer.',h:'💡 Mots-clés SEULEMENT (max 8) — ex. motivated / reliable / trained / calm / teamwork / punctual'}},
 {e:'🕒',t:'Interview Round — Availability',
  a:{label:'Rôle A — Recruiter',w:'You are the recruiter. Ask the candidate about their availability for night shifts, weekends, and how flexible their schedule is.',h:'💡 Mots-clés SEULEMENT (max 8) — ex. availability / night shift / weekend / flexible / schedule'},
  b:{label:'Rôle B — Candidate',w:'You are the candidate. Answer clearly about which shifts you can work and mention any constraints you may have.',h:'💡 Mots-clés SEULEMENT (max 8) — ex. available / flexible / weekends / no problem / transport'}},
 {e:'⚠️',t:'Interview Round — Difficult Situation',
  a:{label:'Rôle A — Recruiter',w:'You are the recruiter. Ask the candidate how they would handle an aggressive visitor who refuses to show identification at the entrance.',h:'💡 Mots-clés SEULEMENT (max 8) — ex. difficult situation / how would you / aggressive visitor / handle'},
  b:{label:'Rôle B — Candidate',w:'You are the candidate. Explain, calmly, the steps you would take to manage the situation professionally and safely.',h:'💡 Mots-clés SEULEMENT (max 8) — ex. stay calm / explain rules / call supervisor / de-escalate / polite'}}
];

/* Mission 5 — The Verdict: free written statement, English, scored by word count (70 words guidance) */
const M5BRIEF={
  ctx:'Final Round — Written Statement to the Panel',
  situation:`The panel has asked every candidate to write a short final statement summarising why they should be offered the position of security agent. This is your last chance to convince them before their decision.`,
  ask:'Write your final statement in ENGLISH (70 words minimum recommended): explain your motivation, your main skills, and why you would be a reliable security agent.'
};

/* ═══════════════════════════ STATE & UTILS ═══════════════════════════ */
let S={
  scr:'home',tc:'0504',sc:'SECURITYJOB',
  g:{n:'',p:[]},pts:0,
  sh:[],rv:[],res:{},wr:[],finalAtt:1,
  t0:null,t1:null,
  att:{m1:1,m2:1,m3:1,m4:1},
  sets1:[],sets3:[],
  m5:{text:''}
};
let E={};let F={};
const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const ftm=(s,e)=>{if(!s||!e)return'—';const d=Math.round((e-s)/1e3);return`${0|d/60}min ${d%60}s`;};

/* ── Local progress save (browser localStorage only, same device — never transmitted) ── */
const SAVE_PREFIX='wigtj_save_';
function teamKey(fn0,ln0,fn1,ln1){const ids=[`${fn0}-${ln0}`,`${fn1}-${ln1}`].sort();return ids.join('_');}
function saveProgress(){
  if(!S._teamKey||!S.t0)return;
  try{
    const data={g:S.g,pts:S.pts,sh:S.sh,wordFor:S.wordFor,rv:S.rv,res:S.res,wr:S.wr,t0:S.t0,
      att:S.att,sets1:S.sets1,sets3:S.sets3,m5:S.m5,finalAtt:S.finalAtt,scr:S.scr,savedAt:Date.now()};
    localStorage.setItem(SAVE_PREFIX+S._teamKey,JSON.stringify(data));
  }catch(e){/* storage unavailable — game still works, simply without resume */}
}
function loadProgress(key){
  try{const raw=localStorage.getItem(SAVE_PREFIX+key);return raw?JSON.parse(raw):null;}catch(e){return null;}
}
function clearProgress(key){try{localStorage.removeItem(SAVE_PREFIX+key);}catch(e){}}

function starRating(n,t){const p=t?n/t:0;if(p>=.9)return{s:3,msg:'Excellent ! 🔥',c:'#8C6D1F'};if(p>=.8)return{s:2,msg:'Bien joué ! 👍',c:'#0F2247'};if(p>=.6)return{s:1,msg:'Peut mieux faire',c:'#C89B3C'};return{s:0,msg:'Courage, continuez ! 💪',c:'#C62828'};}
function stars(n){return'<span class="stars">'+'★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(3-n)+'</span></span>';}
function wc(str){return (str.trim().match(/\S+/g)||[]).length;}

/* Build a QCM set from a vocabulary pool subset — distractors drawn from the FULL bank */
function buildQCMSet(items,fullPool){
  const pool=fullPool||items;
  return items.map((item)=>{
    const others=pool.filter(x=>x.w!==item.w);
    const distractors=shuf(others).slice(0,3).map(x=>x.d);
    const opts=shuf([item.d,...distractors]);
    return{q:`What does "${item.w}" mean?`,o:opts,c:opts.indexOf(item.d)};
  });
}

/* ═══════════════════════════ UI ATOMS ═══════════════════════════ */
const btn=(t,fn,c='teal',extra='')=>`<button class="btn btn-${c} ${extra}" onclick="${fn}">${t}</button>`;
function hdr(lvl){
  const ls=[['📋','Vocab'],['📖','Lecture'],['🔤','Termes'],['🎤','Entretien'],['✍️','Verdict']];
  const dots=ls.map(([e,l],i)=>`${i>0?`<div class="prg-line" style="background:${i+1<=lvl?'var(--teal)':'#E0E0E0'}"></div>`:''}
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
      <div class="prg-dot ${i+1<lvl?'prg-done':i+1===lvl?'prg-active':'prg-future'}">${i+1<lvl?'✓':e}</div>
      <div class="prg-lbl">${l}</div>
    </div>`).join('');
  return `<div class="hdr noprint"><div class="hdr-in"><div class="prg">${dots}</div></div></div>`;

/* ═══════════════════════════ WRITTEN EXERCISES (QCM / VF / MATCH) ═══════════════════════════ */
function startWritten(mission,kind){
  S.att[mission]=1;
  goWrittenAttempt(mission,kind,0);
}
function goWrittenAttempt(mission,kind,attIdx,banner){
  if(kind==='qcm'){
    const qs=buildQCMSet(S.sets1[attIdx],POOL1);
    go('wex',{mission,kind,qs,cur:0,ans:{},done:false,_banner:banner});
  }else if(kind==='vf'){
    const set=M2SETS[attIdx];
    go('wex',{mission,kind,qs:set.vf,text:set.text,title:set.title,cur:0,ans:{},done:false,_banner:banner});
  }else if(kind==='match3'){
    const ps=S.sets3[attIdx];
    go('wex',{mission,kind,ps,sh:shuf(ps.map((_,i)=>i)),sel:null,mt:{},done:false,_banner:banner});
  }
}
function resolveWritten(mission,kind,score,total,wrongItems){
  const att=S.att[mission];
  let passed,ptsDelta;
  if(att===1){passed=score>=Math.ceil(total*0.8);ptsDelta=passed?50:-10;}
  else if(att===2){passed=score>=Math.ceil(total*0.7);ptsDelta=passed?30:-15;}
  else{passed=score>=Math.ceil(total*0.5);ptsDelta=Math.round(score/total*20);}
  S.pts=S.pts+ptsDelta;
  S.res[mission+'-t'+att]={score,total,success:passed,pts:ptsDelta};
  if(!passed)S.wr.push(...wrongItems);
  if(passed||att===3){
    goMissionDone(mission);
  }else{
    S.att[mission]=att+1;
    goWrittenAttempt(mission,kind,att);
  }
}
function goMissionDone(mission){

/* ── QCM renderer ── */
function vQCM(){
  const{qs,cur=0,ans={},done=false}=E;
  if(!qs)return'';
  const q=qs[cur];const L='ABCD';const CC=['var(--teal)','var(--coral)','var(--amber)','#2F4876'];
  const dots=qs.map((_,i)=>{const c=done?(ans[i]===qs[i].c?'var(--green)':'var(--red)'):(ans[i]!=null?'var(--teal)':'#DDD');return`<div onclick="E.cur=${i};render()" style="width:9px;height:9px;border-radius:50%;background:${c};cursor:pointer;display:inline-block;margin:2px"></div>`;}).join('');
  const opts=q.o.map((opt,oi)=>{
    let bc='#E8E8E8',bg='#fff';
    if(ans[cur]===oi){bc='var(--teal)';bg='#E9EDF6';}
    if(done&&oi===q.c){bc='var(--green)';bg='#EDF7EE';}
    if(done&&ans[cur]===oi&&oi!==q.c){bc='var(--red)';bg='#FFEBEE';}
    const lbg=ans[cur]===oi?CC[oi]:'#F0F0F0',lc=ans[cur]===oi?'#fff':'#999';
    const mk=done?(oi===q.c?' ✓':(ans[cur]===oi?' ✗':'')):'';
    return`<div class="opt ${ans[cur]===oi?'sel':''} ${done&&oi===q.c?'right':''} ${done&&ans[cur]===oi&&oi!==q.c?'wrong':''}" onclick="${done?'':(`E.ans[${cur}]=${oi};render()`)}" style="border-color:${bc};background:${bg}">
      <div class="let" style="background:${lbg};color:${lc}">${L[oi]}</div>
      <span style="flex:1">${opt}</span><span style="font-weight:800;color:${done&&oi===q.c?'var(--green)':'var(--red)'}">${mk}</span>
    </div>`;
  }).join('');
  const allA=Object.keys(ans).length===qs.length;
  const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
  const bot=done
    ?`<div style="display:flex;gap:8px;width:100%;margin-top:4px"><div class="ok" style="flex:1;margin:0">${score}/${qs.length} bonnes réponses</div>${btn('Continuer →','wexDone()','coral')}</div>`
    :(allA?btn('✅ Valider mes réponses','E.done=true;render()','teal'):`<small style="color:#CCC;font-size:.78rem">${Object.keys(ans).length}/${qs.length} répondues</small>`);
  return`<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
      <span style="color:#AAA;font-size:.8rem;font-weight:700">Question ${cur+1} / ${qs.length}</span><div>${dots}</div>
    </div>
    <div style="background:var(--tl);border-radius:11px;padding:13px;margin-bottom:12px;font-weight:600;font-size:.9rem;line-height:1.5;color:#333">${q.q}</div>
    ${opts}
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:space-between;align-items:center;flex-wrap:wrap">
      <div style="display:flex;gap:6px">
        ${cur>0?btn('← Préc.',`E.cur=${cur-1};render()`,'gray','sm'):''}
        ${cur<qs.length-1?btn('Suiv. →',`E.cur=${cur+1};render()`,'teal','sm'):''}
      </div>${bot}
    </div>
  </div>`;
}
/* ── V/F renderer ── */
function vVF(){
  const{qs,text,title,ans={},done=false}=E;if(!qs)return'';
  const score=qs.filter((q,i)=>ans[i]===q.a).length;
  const rows=qs.map((q,i)=>{
    const bg=done?(ans[i]===q.a?'#EDF7EE':'#FFEBEE'):'#fff';

      <span style="width:21px;height:21px;background:var(--teal);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0">${i+1}</span>

      </div>

    </div>`;
  }).join('');
  const allA=Object.keys(ans).length===qs.length;
  const bot=done
    ?`<div style="display:flex;gap:8px;width:100%"><div class="ok" style="flex:1;margin:0">${score}/${qs.length} bonnes réponses</div>${btn('Continuer →','wexDone()','coral')}</div>`
    :btn('✅ Valider',`E.done=true;render()`,'teal','',!allA);
  return`<div class="rtxt"><strong style="color:var(--teal2);font-size:.8rem">📄 ${title}</strong><br><br>${text.replace(/\n\n/g,'<br><br>')}</div>${rows}<div style="margin-top:12px;display:flex;justify-content:flex-end">${bot}</div>`;
}
/* ── Matching renderer (Mission 3 — FR term / EN translation) ── */
function vMatch(){
  const{ps,sh,sel,mt={},done=false}=E;if(!ps)return'';
  const used=Object.values(mt);
  const words=ps.map((p,i)=>{
    const isM=mt[i]!=null,ok=done&&mt[i]===i,ko=done&&isM&&mt[i]!==i;
    return`<div class="mi${sel===i?' msel':''}${isM&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}" onclick="${done||isM?'':(`selW(${i})`)}">
      <strong style="flex:1">${p.w}</strong>
      ${isM&&!done?'<span style="color:var(--coral);font-size:.72rem">✓</span>':''}
      ${ok?'<span style="color:var(--green)">✓</span>':''}${ko?'<span style="color:var(--red)">✗</span>':''}
    </div>`;
  }).join('');
  const defs=sh.map(orig=>{
    const isU=used.includes(orig);
    const mKey=Object.keys(mt).find(k=>mt[k]===orig);
    const ok=done&&mKey!=null&&Number(mKey)===orig;
    const ko=done&&isU&&!ok;
    return`<div class="mi${isU&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}" onclick="${isU?'':(`selD(${orig})`)}">${ps[orig].d}</div>`;
  }).join('');
  const allM=Object.keys(mt).length===ps.length;
  const score=ps.filter((_,i)=>mt[i]===i).length;
  const bot=done
    ?`<div style="display:flex;gap:8px;width:100%"><div class="ok" style="flex:1;margin:0">${score}/${ps.length} bonnes réponses</div>${btn('Continuer →','wexDone()','coral')}</div>`
    :(allM?btn('✅ Valider','E.done=true;render()','teal'):`<small style="color:#CCC;font-size:.78rem">${Object.keys(mt).length}/${ps.length} associés</small>`);
  return`<div class="hint" style="margin-bottom:12px">⚠️ Aucun retour en arrière possible : lisez bien avant de valider chaque association !</div><p style="color:#AAA;font-size:.8rem;margin-bottom:10px;font-weight:700">① Cliquez un terme français → ② Cliquez sa traduction anglaise</p>
  <div class="mg"><div><div style="font-weight:800;color:var(--coral);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Termes français</div>${words}</div>
  <div><div style="font-weight:800;color:var(--amber);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Traductions anglaises</div>${defs}</div></div>
  <div style="margin-top:13px;display:flex;justify-content:flex-end">${bot}</div>`;
}
function selW(i){if(E.done||E.mt[i]!=null)return;E.sel=E.sel===i?null:i;render();}
function selD(orig){if(E.done||Object.values(E.mt||{}).includes(orig)||E.sel==null)return;if(!E.mt)E.mt={};E.mt[E.sel]=orig;E.sel=null;render();}

function wexDone(){
  const{mission,kind,qs,ps,ans={},mt={}}=E;
  if(kind==='qcm'){
    const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
    const wrong=qs.flatMap((q,i)=>ans[i]!==q.c?[{level:'M1',question:q.q,given:ans[i]!=null?q.o[ans[i]]:'—',correct:q.o[q.c]}]:[]);
    resolveWritten(mission,kind,score,qs.length,wrong);
  }else if(kind==='vf'){
    const score=qs.filter((q,i)=>ans[i]===q.a).length;
    const wrong=qs.flatMap((q,i)=>ans[i]!==q.a?[{level:'M2',question:q.s,given:ans[i]?'VRAI':'FAUX',correct:q.a?'VRAI':'FAUX'}]:[]);
    resolveWritten(mission,kind,score,qs.length,wrong);
  }else if(kind==='match3'){
    const score=ps.filter((_,i)=>mt[i]===i).length;
    const wrong=ps.flatMap((p,i)=>mt[i]!==i?[{level:'M3',question:`Match: ${p.w}`,given:mt[i]!=null?ps[mt[i]]?.d:'—',correct:p.d}]:[]);
    resolveWritten(mission,kind,score,ps.length,wrong);
  }
}

function resolveOral(mission,grade){

  if(att===1){passed=grade>=9;ptsDelta=passed?50:-10;}
  else if(att===2){passed=grade>=8;ptsDelta=passed?30:-15;}
  else{passed=grade>=8;ptsDelta=grade*2;}

/* ═══════════════════════════ REPORT ═══════════════════════════ */
function vReport(){
  const dur=ftm(S.t0,S.t1);
  const MISSIONS=[
    {key:'m1',icon:'📋',title:'Mission 1 — The Job Ad',level:'M1'},
    {key:'m2',icon:'📖',title:"Mission 2 — The Candidate's File",level:'M2'},
    {key:'m3',icon:'🔤',title:'Mission 3 — HR Terminology',level:'M3'},
    {key:'m4',icon:'🎤',title:'Mission 4 — The Interview',level:null},
    {key:'m5',icon:'✍️',title:'Mission 5 — The Verdict',level:null}
  ];
  const missionBlocks=MISSIONS.map(m=>{
    const attempts=Object.entries(S.res).filter(([k])=>k.startsWith(m.key+'-t')).sort((a,b)=>a[0].localeCompare(b[0]));
    if(attempts.length===0)return'';
    if(m.key==='m5'){
      const v=attempts[0][1];
      const bg=v.pts>=0?'#EDF7EE':'#FFEBEE';
      const bc=v.pts>=0?'var(--green)':'var(--red)';
      return `<div class="card"><div class="pop" style="color:var(--teal);margin-bottom:10px">${m.icon} ${m.title}</div>
        <div style="padding:10px 13px;border-radius:10px;background:${bg};border-left:4px solid ${bc};margin-bottom:10px;font-size:.86rem">
          <strong>Verdict soumis</strong> — ${v.words} mots <span style="float:right;color:${bc};font-weight:700">${v.pts>=0?'+':''}${v.pts} pts</span>
        </div>
        <p style="white-space:pre-wrap;font-size:.87rem;line-height:1.7;color:#333;background:#F8FAFD;padding:12px;border-radius:10px">${(v.report||'').replace(/</g,'&lt;')}</p>
        <p style="color:#AAA;font-size:.78rem;margin-top:8px">👩‍🏫 Ce texte sera également corrigé et noté par la professeure.</p>
      </div>`;
    }
    if(m.key==='m4'){
      const rows=attempts.map(([k,v])=>{
        const attN=k.split('-t')[1];
        const bg=v.success?'#EDF7EE':'#FFEBEE';
        const bc=v.success?'var(--green)':'var(--red)';
        const lbl=v.success?'✓ Réussi':'';
        return `<div style="padding:9px 13px;border-radius:9px;background:${bg};border-left:4px solid ${bc};margin-bottom:6px;font-size:.86rem">
          <strong>Tentative ${attN}</strong> ${lbl?`<span style="color:${bc};font-weight:700">${lbl}</span>`:''} — ${v.grade}/10 <span style="float:right;color:${bc};font-weight:700">${v.pts>=0?'+':''}${v.pts} pts</span>
        </div>`;
      }).join('');
      return `<div class="card"><div class="pop" style="color:var(--teal);margin-bottom:10px">${m.icon} ${m.title}</div>${rows}<p style="color:#AAA;font-size:.78rem;margin-top:8px">🎭 Rôles tirés au sort à chaque tentative — Recruteur / Candidat.</p></div>`;
    }
    const rows=attempts.map(([k,v])=>{
      const attN=k.split('-t')[1];
      const bg=v.success?'#EDF7EE':'#FFEBEE';
      const bc=v.success?'var(--green)':'var(--red)';
      const lbl=v.success?'✓ Réussi':'';
      return `<div style="padding:9px 13px;border-radius:9px;background:${bg};border-left:4px solid ${bc};margin-bottom:6px;font-size:.86rem">
        <strong>Tentative ${attN}</strong> ${lbl?`<span style="color:${bc};font-weight:700">${lbl}</span>`:''} — ${v.score}/${v.total} <span style="float:right;color:${bc};font-weight:700">${v.pts>=0?'+':''}${v.pts} pts</span>
      </div>`;
    }).join('');
    const corrections=S.wr.filter(w=>w.level===m.level);
    const correctionsHtml=corrections.length
      ?`<div style="margin-top:10px"><div style="font-weight:800;color:var(--red);font-size:.8rem;margin-bottom:6px">Corrections</div>${corrections.map(w=>`<div style="background:#fff;border:1px solid #E3D9D9;border-radius:9px;padding:11px;margin-bottom:8px"><div style="font-weight:700;font-size:.84rem;color:#333">${w.question}</div><div style="color:var(--red);font-size:.8rem;margin-top:3px">✗ Réponse donnée : ${w.given||'—'}</div><div style="color:var(--green);font-size:.8rem">✓ Réponse correcte : ${w.correct}</div></div>`).join('')}</div>`
      :`<div class="ok" style="margin-top:8px;text-align:center;font-size:.82rem">🏆 Aucune erreur</div>`;
    return `<div class="card"><div class="pop" style="color:var(--teal);margin-bottom:10px">${m.icon} ${m.title}</div>${rows}${correctionsHtml}</div>`;
  }).join('');
  const fr=S.res['final'];
  const finalBlock=fr?(()=>{
    const bg=fr.success?'#EDF7EE':'#FFEBEE';
    const bc=fr.success?'var(--green)':'var(--red)';
    const lbl=fr.success?'✓ Trouvé':'';
    return `<div class="card"><div class="pop" style="color:var(--teal);margin-bottom:10px">🔐 Master Code</div>
      <div style="padding:9px 13px;border-radius:9px;background:${bg};border-left:4px solid ${bc};font-size:.86rem">
        <strong>${fr.attempts} tentative${fr.attempts>1?'s':''}</strong> ${lbl?`<span style="color:${bc};font-weight:700">${lbl}</span>`:''} <span style="float:right;color:${bc};font-weight:700">${fr.pts>=0?'+':''}${fr.pts} pts</span>
      </div>
    </div>`;
  })():'';
  const parts=S.g.p.map(p=>`<span class="chip">${p.fn}-${p.ln}</span>`).join(' ');
  return`<div id="rep" style="max-width:780px;margin:0 auto;padding:20px;padding-bottom:40px">
  <div class="noprint" style="margin-bottom:14px;display:flex;gap:9px;flex-wrap:wrap">
    ${btn('← Retour',"go(S._returnTo||'vic',S._returnE||{})",'gray','sm')}
    ${btn('🖨️ Imprimer / Enregistrer PDF','window.print()','teal','sm')}
    ${btn('📝 Télécharger en Word','downloadWord()','coral','sm')}
  </div>
  <div class="glass" style="background:linear-gradient(135deg,var(--teal),var(--coral));border-radius:18px;padding:28px;text-align:center;color:#fff;margin-bottom:16px;print-color-adjust:exact;-webkit-print-color-adjust:exact">
    <div class="pop" style="font-size:1.6rem;margin-bottom:4px">💼 Will I Get The Job?</div>
    <div style="opacity:.85;font-size:.88rem">English Escape Game — CAP Agent de Sécurité</div>
    <div style="opacity:.7;font-size:.78rem;margin-top:4px">${new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
    <div class="card" style="text-align:center;border-top:3px solid var(--teal)"><div style="font-weight:800;font-size:1rem;color:var(--teal)">${S.g.n}</div><div style="color:#888;font-size:.78rem;margin-top:3px">Équipe</div><div style="margin-top:7px">${parts}</div></div>
    <div class="card" style="text-align:center;border-top:3px solid var(--coral)"><div class="pop" style="font-size:1.9rem;color:var(--teal)">${S.pts}</div><div style="color:#888;font-size:.78rem">Points • ${dur}</div><div style="margin-top:6px">${stars(starRating(S.pts,350).s)}</div></div>
  </div>
  ${missionBlocks}
  ${finalBlock}
  <div style="text-align:center;color:#BBB;font-size:.76rem;margin-top:6px">Créé par C. Iemfre • Will I Get The Job? — English Escape Game CAP Agent de Sécurité</div>
  </div>`;
}

/* ── Export the report as an editable Word (.doc) file — client-side, no external library. ── */
function buildReportHTML(){
  const styleTag=document.querySelector('style').outerHTML;
  const repEl=document.getElementById('rep').cloneNode(true);
  repEl.querySelectorAll('.noprint').forEach(el=>el.remove());
  return `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>Rapport</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
${styleTag}
</head><body>${repEl.outerHTML}</body></html>`;
}
function downloadWord(){
  const html=buildReportHTML();
  const blob=new Blob(['\ufeff'+html],{type:'application/msword'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`rapport-${(S.g.n||'equipe').replace(/[^a-zA-Z0-9]/g,'_')}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ═══════════════════════════ ROUTER ═══════════════════════════ */
function go(scr,ei={}){E=ei;S.scr=scr;render();window.scrollTo(0,0);}
function render(){document.getElementById('app').innerHTML=view()+scoreBadge()+reportFab();}
function view(){
  const sc=S.scr;
  if(sc==='home')return vHome();
  if(sc==='rules')return vRules();
  if(sc==='rgpd')return vRGPD();
  if(sc==='tlg')return vLogin('Interface Professeur','tdb');
  if(sc==='tdb')return vTeacher();
  if(sc==='slg')return vLogin('Connexion Équipe','grp');
  if(sc==='grp')return vGroup();
  if(sc==='resume')return vResume();

  const W=hdr;
  /* Mission 1 — The Job Ad (QCM) */
  if(sc==='m1i')return W(1)+`<div class="page">${lvlIntro('📋','Mission 1 — The Job Ad','Vocabulaire du recrutement','<p style="font-weight:700;margin-bottom:7px">A new job advertisement has just been published!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Avant de postuler, prouvez que vous maîtrisez le vocabulaire essentiel du recrutement dans la sécurité. 10 questions. Seuil de réussite : ≥ 8/10. 3 tentatives possibles, aucun blocage.</p>',"startWritten('m1','qcm')",'teal')}</div>`;
  if(sc==='wex'&&E.mission==='m1')return W(1)+`<div class="page">${E._banner||''}<div class="card card-teal"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--teal);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m1}</span><strong style="font-size:.95rem">QCM — Vocabulaire du recrutement</strong></div>${vQCM()}</div></div>`;
  if(sc==='m1d')return W(1)+`<div class="page">${indiceScreen('m1',"go('m2i')")}</div>`;

  /* Mission 2 — The Candidate's File (VF) */
  if(sc==='m2i')return W(2)+`<div class="page">${lvlIntro('📖',"Mission 2 — The Candidate's File",'Compréhension écrite','<p style="font-weight:700;margin-bottom:7px">A candidate\'s file has just arrived!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Lisez le texte professionnel puis répondez aux 8 affirmations Vrai/Faux. Seuil : ≥ 80% à la 1ère tentative, ≥ 70% à la 2e. 3 tentatives possibles, aucun blocage.</p>',"startWritten('m2','vf')",'coral')}</div>`;
  if(sc==='wex'&&E.mission==='m2')return W(2)+`<div class="page">${E._banner||''}<div class="card card-coral"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--coral);color:#2B2005;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m2}</span><strong style="font-size:.95rem">Vrai / Faux</strong></div>${vVF()}</div></div>`;
  if(sc==='m2d')return W(2)+`<div class="page">${indiceScreen('m2',"go('m3i')")}</div>`;

  /* Mission 3 — HR Terminology (Matching FR/EN) */
  if(sc==='m3i')return W(3)+`<div class="page">${lvlIntro('🔤','Mission 3 — HR Terminology','Traduction professionnelle','<p style="font-weight:700;margin-bottom:7px">The HR paperwork is scrambled!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Associez chaque terme RH français à sa traduction anglaise exacte. Seuil : ≥ 8/10. 3 tentatives possibles, aucun blocage.</p><p style="color:var(--red);font-weight:700;font-size:.84rem;margin-top:8px">⚠️ Lisez bien tous les mots AVANT de commencer : une fois qu\'une association est validée, il est impossible de revenir en arrière ou de la corriger !</p>',"startWritten('m3','match3')",'amber')}</div>`;
  if(sc==='wex'&&E.mission==='m3')return W(3)+`<div class="page">${E._banner||''}<div class="card card-amber"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--amber);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m3}</span><strong style="font-size:.95rem">Traduction — Français / Anglais</strong></div>${vMatch()}</div></div>`;
  if(sc==='m3d')return W(3)+`<div class="page">${indiceScreen('m3',"go('m4i')")}</div>`;

  /* Mission 4 — The Interview (role-based oral) */
  if(sc==='m4i')return W(4)+`<div class="page">${lvlIntro('🎤','Mission 4 — The Interview','Entretien d\'embauche à deux rôles','<p style="font-weight:700;margin-bottom:7px">It\'s interview time!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Les rôles sont tirés au sort : un(e) élève joue le <strong>recruteur</strong> (Rôle A), l\'autre le <strong>candidat</strong> (Rôle B). Chacun lit sa propre fiche. <strong>Mots-clés seulement, 8 maximum par élève, aucune phrase apprise.</strong></p>',"startOral('m4')",'teal')}</div>`;
  if(sc==='oex'&&E.mission==='m4')return W(4)+`<div class="page">${vOralRoles()}</div>`;
  if(sc==='m4d')return W(4)+`<div class="page">${indiceScreen('m4',"go('m5i')")}</div>`;

  /* Mission 5 — The Verdict (written) */
  if(sc==='m5i')return W(5)+`<div class="page">${lvlIntro('✍️','Mission 5 — The Verdict','Compte rendu écrit final','<p style="font-weight:700;margin-bottom:7px">The panel is waiting for your final statement!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Rédigez un texte de motivation en anglais pour convaincre le jury de vous embaucher. Vous pouvez arrêter votre rédaction quand vous le souhaitez : les points automatiques dépendent du nombre de mots (70 mots recommandés). La professeure lira aussi votre texte et vous attribuera une note à part.</p>',"go('m5w')",'coral')}</div>`;
  if(sc==='m5w')return W(5)+`<div class="page">${vM5()}</div>`;
  if(sc==='m5d')return W(5)+`<div class="page">${indiceScreen('m5',"go('fin')")}</div>`;

  if(sc==='fin')return W(5)+`<div class="page">${vFinal()}</div>`;
  if(sc==='vic')return W(5)+`<div class="page">${vVictory()}</div>`;
  if(sc==='rep')return vReport();
  return'<p>Écran inconnu</p>';
}
render();
